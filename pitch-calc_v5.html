<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ピッチ換算 pitch-calc v5</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--fg:#1d1d1f;--sub:#6e6e73;--line:#d2d2d7;--acc:#0a66d6;--err:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--sub:#98989d;--line:#38383a;--acc:#4da3ff;--err:#ff6b6b}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overflow:hidden;
padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
main{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:6px}
h1{display:none}
label{display:none}
input,textarea{width:100%;font:inherit;font-size:17px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
textarea{height:52px;resize:none;line-height:1.3}
.ref{display:flex;gap:6px;align-items:center}
.ref span{font-size:12px;color:var(--sub);white-space:nowrap}
.ref input{max-width:130px;padding:4px 8px;font-size:16px}
.chips{display:flex;gap:5px;flex-wrap:nowrap}
button.chip{font:inherit;font-size:13px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);cursor:pointer;white-space:nowrap;touch-action:manipulation}
button.chip:active{background:var(--line)}
#out{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin-bottom:6px}
.card h2{font-size:13px;margin:0 0 2px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.row{display:flex;justify-content:space-between;gap:6px;padding:2px 0;border-top:1px solid var(--line)}
.k{color:var(--sub);font-size:12px;white-space:nowrap}
.v{font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.err{color:var(--err);font-size:13px}
.refline{font-size:12px;color:var(--acc);margin-bottom:3px}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.pad button{font:inherit;font-size:18px;height:min(44px,5.6dvh);padding:0;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad button:active{background:var(--line)}
.pad .w2{grid-column:span 2}
.pad .fn{color:var(--acc);font-size:15px}
</style>

<body>
<main>
<div class="ref"><span>基準Hz</span><input id="ref" inputmode="decimal" value="440" autocomplete="off"></div>
<div class="chips"><button class="chip" data-ref="440">440</button><button class="chip" data-ref="432">432</button><button class="chip" data-ref="m50">440-50c</button><button class="chip" data-ref="p50">440+50c</button></div>
<div id="out"></div>
<textarea id="inp" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="入力 例: 440Hz-50c（複数は区切りで）"></textarea>
<div class="chips"><button class="chip" data-in="432Hz">432Hz</button><button class="chip" data-in="+50c">+50c</button><button class="chip" data-in="-50c">-50c</button></div>
<div class="pad" id="pad">
<button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="A">A</button><button data-k="B">B</button>
<button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="C">C</button><button data-k="D">D</button>
<button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="E">E</button><button data-k="F">F</button>
<button data-k="0">0</button><button data-k=".">.</button><button data-k="+">+</button><button data-k="-">−</button><button data-k="G">G</button>
<button data-k="#">#</button><button data-k="b">b</button><button data-k="c">c</button><button data-k="Hz">Hz</button><button class="fn" data-k="\n">区切り</button>
<button class="fn w2" data-fn="bs">⌫ 削除</button><button class="fn w2" data-fn="clr">全消去</button><button class="fn" data-fn="kb">⌨</button>
</div>
</main>
<script id="core">
const NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const BASE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function num(s){const x=Number(s);if(!isFinite(x)||s==="")throw new Error(s);return x;}
function parse(s,REF){
  const t=s.trim().replace(/♯/g,"#").replace(/♭/g,"b").replace(/セント/g,"c").replace(/の/g,"").replace(/ /g,"");
  let m=/^([\d.]+)hz$/i.exec(t);
  if(m)return [num(m[1]),true];
  m=/^([\d.]+)hz([+-][\d.]+)c$/i.exec(t);
  if(m)return [num(m[1])*Math.pow(2,num(m[2])/1200),false];
  m=/^([+-]?[\d.]+)c$/i.exec(t);
  if(m)return [REF*Math.pow(2,num(m[1])/1200),false];
  m=/^([A-Ga-g])([#b]*)(-?\d+)([+-][\d.]+)?c?$/.exec(t);
  if(m){
    const acc=(m[2].match(/#/g)||[]).length-(m[2].match(/b/g)||[]).length;
    const midi=(parseInt(m[3],10)+1)*12+BASE[m[1].toUpperCase()]+acc;
    const c=m[4]?num(m[4]):0.0;
    return [REF*Math.pow(2,(midi-69)/12+c/1200),false];
  }
  throw new Error(s);
}
function calc(hz,hzInput,REF){
  if(!(hz>0))throw new Error("hz");
  const A1=1200*Math.log2(hz/REF);
  const midi=69+Math.floor(A1/100+0.5+1e-9);
  const mod=((midi%12)+12)%12;
  const note=NAMES[mod]+(Math.floor(midi/12)-1);
  const A2=A1-(midi-69)*100;
  const B1=hzInput?null:hz;
  const B2=REF*Math.pow(2,A2/1200);
  const C1=hz/REF*100;
  return {A1,note,A2,B1,B2,C1,C2:C1-100};
}
function fx(x,d){
  // Pythonの書式（厳密な2進値に対する偶数丸め）に合わせる。toFixedはちょうど半分で切り上げるため差が出る。
  const a=Math.abs(x);
  if(a>=1e21)return a.toFixed(d);
  const f=a.toFixed(100),i=f.indexOf("."),fr=f.slice(i+1);
  if(fr[d]==="5"&&/^0*$/.test(fr.slice(d+1))){
    const t=f.slice(0,d>0?i+1+d:i);
    const last=t[t.length-1];
    if(last!=="."&&(+last)%2===0)return t;
  }
  return a.toFixed(d);
}
function sg(x,d){return ((x<0||Object.is(x,-0))?"-":"+")+fx(x,d);}
function format(r){
  return [
    ["A-1",sg(r.A1,2)+"c"],
    ["A-2",r.note+" "+sg(r.A2,2)+"c"],
    ["B-1",r.B1===null?"—(入力がHz)":fx(r.B1,3)+"Hz"],
    ["B-2",fx(r.B2,3)+"Hz"],
    ["C-1",fx(r.C1,2)+"%"],
    ["C-2",sg(r.C2,2)+"%"]
  ];
}
</script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function render(){
    const refTxt=$("ref").value.trim()||"440";
    const out=$("out");
    let REF;
    try{REF=num(refTxt);if(!(REF>0))throw 0;}catch(e){out.innerHTML='<p class="err">基準Hzは正の数で入力してください</p>';return;}
    const items=$("inp").value.split(/[,，、;；\n]+/).map(s=>s.trim()).filter(Boolean);
    let h="";
    if(REF!==440)h+='<div class="refline">基準 A4='+esc(Number.isInteger(REF)?String(REF):REF.toFixed(3))+'Hz</div>';
    for(const s of items){
      try{
        const p=parse(s,REF);const r=calc(p[0],p[1],REF);
        h+='<div class="card"><h2>'+esc(s)+'</h2>'+'<div class="grid">'+format(r).map(x=>'<div class="row"><span class="k">'+x[0]+'</span><span class="v">'+esc(x[1])+'</span></div>').join("")+'</div></div>';
      }catch(e){
        h+='<div class="card"><h2>'+esc(s)+'</h2><div class="err">解釈できません。書式例: 523.25Hz / 440Hz-50c / +30c / C#5+20c</div></div>';
      }
    }
    out.innerHTML=h;
  }
  $("ref").addEventListener("input",render);
  $("inp").addEventListener("input",render);
  const REFS={"440":"440","432":"432","m50":String(440*Math.pow(2,-50/1200)),"p50":String(440*Math.pow(2,50/1200))};
  document.querySelectorAll("button[data-ref]").forEach(b=>b.addEventListener("click",()=>{$("ref").value=REFS[b.dataset.ref];render();}));
  document.querySelectorAll("button[data-in]").forEach(b=>b.addEventListener("click",()=>{$("inp").value=b.dataset.in;render();}));
  const ta=$("inp");
  function ins(t){const a=ta.selectionStart,e=ta.selectionEnd;ta.setRangeText(t,a,e,"end");render();try{ta.focus({preventScroll:true});}catch(x){}}
  $("pad").addEventListener("pointerdown",e=>{if(e.target.closest("button"))e.preventDefault();});
  $("pad").addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.k!==undefined){ins(b.dataset.k==="\\n"?"\n":b.dataset.k);return;}
    const f=b.dataset.fn;
    if(f==="bs"){const a=ta.selectionStart,z=ta.selectionEnd;if(a!==z)ta.setRangeText("",a,z,"end");else if(a>0)ta.setRangeText("",a-1,a,"end");render();}
    else if(f==="clr"){ta.value="";render();}
    else if(f==="kb"){const on=ta.getAttribute("inputmode")==="none";ta.setAttribute("inputmode",on?"text":"none");ta.blur();if(on)ta.focus();b.style.opacity=on?"1":"0.5";}
  });
  render();
})();
</script>
</body>
